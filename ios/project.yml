name: SailingGPS
options:
  bundleIdPrefix: com.goldenfalcons
  deploymentTarget:
    iOS: '17.0'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  SailingGPS:
    type: application
    platform: iOS
    sources: [SailingGPS, Shared]
    dependencies:
      - target: SailingGPSWatch
        embed: true
      - package: ZIPFoundation
    info:
      path: SailingGPS/Info.plist
      properties:
        CFBundleDisplayName: Sailing GPS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [location, audio]
        NSLocationWhenInUseUsageDescription: 航行位置と航跡を表示・記録します。
        NSLocationAlwaysAndWhenInUseUsageDescription: 画面を消した状態でも、開始した航跡記録を続けます。
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldenfalcons.sailinggps
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '1.7.20'
        CURRENT_PROJECT_VERSION: 44
        TARGETED_DEVICE_FAMILY: '1,2'
      configs:
        Release:
          CODE_SIGN_STYLE: '$(SAILING_CODE_SIGN_STYLE)'
          CODE_SIGN_IDENTITY: '$(SAILING_CODE_SIGN_IDENTITY)'
          PROVISIONING_PROFILE_SPECIFIER: '$(SAILING_PROFILE_UUID)'
    scheme: {}
  SailingGPSWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources: [SailingGPSWatch, Shared]
    info:
      path: SailingGPSWatch/Info.plist
      properties:
        CFBundleDisplayName: Sailing GPS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocationWhenInUseUsageDescription: Watchの現在地から目標距離・方位・SOG・COGを表示します。
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.goldenfalcons.sailinggps
        WKRunsIndependentlyOfCompanionApp: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.goldenfalcons.sailinggps.watchkitapp
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '1.7.20'
        CURRENT_PROJECT_VERSION: 44
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: '$(SAILING_CODE_SIGN_STYLE)'
          CODE_SIGN_IDENTITY: '$(SAILING_CODE_SIGN_IDENTITY)'
          PROVISIONING_PROFILE_SPECIFIER: '$(SAILING_WATCH_PROFILE_UUID)'
    scheme: {}
