<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071827">
  <title>Sailing GPS Logger</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      color-scheme: dark;
      --bg:#06121d;
      --panel:#0d2233;
      --panel2:#102c42;
      --text:#f2f7fb;
      --muted:#9fb4c5;
      --accent:#46c8ff;
      --ok:#4de2a0;
      --warn:#ffd166;
      --danger:#ff6b6b;
      --border:#24465f;
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:linear-gradient(180deg,#06121d,#091b29);
      color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      min-height:100vh;
    }
    main{max-width:820px;margin:auto;padding:16px 14px 40px}
    h1{margin:0 0 4px;font-size:1.5rem}
    .subtitle{color:var(--muted);margin:0 0 14px;font-size:.92rem}
    .statusbar{
      display:flex;gap:10px;align-items:center;justify-content:space-between;
      background:var(--panel);border:1px solid var(--border);border-radius:14px;
      padding:12px;margin-bottom:12px
    }
    .badge{font-weight:700;color:var(--warn)}
    .badge.running{color:var(--ok)}
    .grid{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;
    }
    .card{
      background:var(--panel);border:1px solid var(--border);
      border-radius:15px;padding:14px;min-height:112px;
    }
    .card.large{min-height:130px}
    .label{font-size:.82rem;color:var(--muted);letter-spacing:.05em}
    .value{font-size:2rem;font-weight:800;margin-top:6px;line-height:1.05}
    .unit{font-size:1rem;color:var(--muted);font-weight:600}
    .small{font-size:1rem;color:var(--muted);margin-top:8px;word-break:break-all}
    section{
      background:var(--panel);border:1px solid var(--border);
      border-radius:15px;padding:14px;margin-top:12px;
    }
    h2{font-size:1.05rem;margin:0 0 10px}
    .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    input,button,select{
      width:100%;border-radius:10px;border:1px solid var(--border);
      padding:12px;font-size:1rem;
    }
    input,select{background:#071827;color:var(--text)}
    button{background:var(--panel2);color:var(--text);font-weight:700;cursor:pointer}
    button.primary{background:#0b78a8;border-color:#199bd1}
    button.danger{background:#6a252b;border-color:#98404a}
    button:disabled{opacity:.45;cursor:not-allowed}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .full{grid-column:1/-1}
    pre{
      margin:0;background:#04101a;border-radius:10px;padding:10px;
      min-height:130px;max-height:230px;overflow:auto;color:#b9e5ff;
      white-space:pre-wrap;font-size:.78rem
    }
    .notice{
      color:var(--warn);font-size:.88rem;line-height:1.5;margin-top:8px
    }
    @media(max-width:560px){
      .value{font-size:1.65rem}
      .grid,.formgrid,.buttons{grid-template-columns:1fr 1fr}
    }
  </style>
</head>
<body>
<main>
  <h1>Sailing GPS Logger</h1>
  <p class="subtitle">地図なし・ヨット用GPS計器／GPXロガー</p>

  <div class="statusbar">
    <div><span class="label">状態</span><br><span id="status" class="badge">停止中</span></div>
    <div style="text-align:right"><span class="label">保存点数</span><br><strong id="count">0</strong></div>
  </div>

  <div class="grid">
    <div class="card large">
      <div class="label">SOG</div>
      <div class="value"><span id="sog">--</span> <span class="unit">kt</span></div>
      <div id="sogMps" class="small">-- m/s</div>
    </div>
    <div class="card large">
      <div class="label">COG</div>
      <div class="value"><span id="cog">--</span><span class="unit">°</span></div>
      <div id="cardinal" class="small">--</div>
    </div>
    <div class="card">
      <div class="label">WP 絶対方位</div>
      <div class="value"><span id="bearing">--</span><span class="unit">°</span></div>
    </div>
    <div class="card">
      <div class="label">WP 距離</div>
      <div class="value"><span id="distanceNm">--</span> <span class="unit">NM</span></div>
      <div id="distanceM" class="small">-- m</div>
    </div>
    <div class="card">
      <div class="label">相対方位（12時方式）</div>
      <div id="relativeClock" class="value" style="font-size:1.6rem">--</div>
    </div>
    <div class="card">
      <div class="label">相対方位（左右度方式）</div>
      <div id="relativeLR" class="value" style="font-size:1.6rem">--</div>
    </div>
  </div>

  <section>
    <h2>現在地</h2>
    <div id="position" class="small">まだ取得していません</div>
    <div id="accuracy" class="small">精度: --</div>
  </section>

  <section>
    <h2>ウェイポイント</h2>
    <div class="formgrid">
      <input id="wpName" class="full" type="text" placeholder="名称（例：江の島沖ブイ）">
      <input id="wpLat" inputmode="decimal" type="number" step="any" placeholder="緯度 例: 35.300367">
      <input id="wpLon" inputmode="decimal" type="number" step="any" placeholder="経度 例: 139.488318">
    </div>
    <div class="buttons">
      <button id="saveWp">入力値を保存</button>
      <button id="currentWp">現在地をWPにする</button>
      <button id="clearWp" class="danger full">ウェイポイント削除</button>
    </div>
    <div id="wpInfo" class="small">未設定</div>
  </section>

  <section>
    <h2>GPS記録</h2>
    <div class="formgrid">
      <label>
        <span class="label">最低保存間隔</span>
        <select id="interval">
          <option value="1000">1秒</option>
          <option value="2000">2秒</option>
          <option value="5000">5秒</option>
          <option value="10000">10秒</option>
        </select>
      </label>
      <label>
        <span class="label">最低移動距離</span>
        <select id="minDistance">
          <option value="0">指定なし</option>
          <option value="1">1 m</option>
          <option value="3">3 m</option>
          <option value="5">5 m</option>
          <option value="10">10 m</option>
        </select>
      </label>
    </div>
    <div class="buttons">
      <button id="start" class="primary">記録開始</button>
      <button id="stop" disabled>記録停止</button>
      <button id="exportGpx">GPX保存</button>
      <button id="exportCsv">CSV保存</button>
      <button id="clearData" class="danger full">記録データ削除</button>
    </div>
    <p class="notice">Web版は画面消灯・バックグラウンド移行時に、iPhone/Android側の判断でGPS更新が停止する場合があります。確実な画面OFF記録にはネイティブアプリが必要です。</p>
  </section>

  <section>
    <h2>デバッグログ</h2>
    <pre id="log"></pre>
  </section>
</main>

<script>
"use strict";

const STORAGE_POINTS = "sailingGps.points.v1";
const STORAGE_WP = "sailingGps.waypoint.v1";
const STORAGE_SETTINGS = "sailingGps.settings.v1";
const MPS_TO_KT = 1.9438444924406;
const M_TO_NM = 1 / 1852;
const EARTH_RADIUS_M = 6371000;

let points = loadJson(STORAGE_POINTS, []);
let waypoint = loadJson(STORAGE_WP, null);
let watchId = null;
let latest = null;
let previousAccepted = points.length ? points[points.length - 1] : null;

const $ = id => document.getElementById(id);

function log(message) {
  const line = `[${new Date().toLocaleString("ja-JP")}] ${message}`;
  $("log").textContent += line + "\n";
  $("log").scrollTop = $("log").scrollHeight;
  console.log(line);
}

function loadJson(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    console.error(e);
    return fallback;
  }
}

function saveJson(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function normalize360(deg) {
  const r = deg % 360;
  return r < 0 ? r + 360 : r;
}

function normalize180(deg) {
  let r = normalize360(deg);
  if (r > 180) r -= 360;
  return r;
}

function toRad(v) { return v * Math.PI / 180; }
function toDeg(v) { return v * 180 / Math.PI; }

function distanceMeters(lat1, lon1, lat2, lon2) {
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const p1 = toRad(lat1);
  const p2 = toRad(lat2);
  const a = Math.sin(dLat/2) ** 2 +
            Math.cos(p1) * Math.cos(p2) * Math.sin(dLon/2) ** 2;
  return 2 * EARTH_RADIUS_M * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function bearingDegrees(lat1, lon1, lat2, lon2) {
  const p1 = toRad(lat1);
  const p2 = toRad(lat2);
  const dl = toRad(lon2-lon1);
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1)*Math.sin(p2) -
            Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return normalize360(toDeg(Math.atan2(y,x)));
}

function calculatedCourse(a, b) {
  if (!a || !b) return null;
  if (distanceMeters(a.latitude, a.longitude, b.latitude, b.longitude) < 0.5) return null;
  return bearingDegrees(a.latitude, a.longitude, b.latitude, b.longitude);
}

function calculatedSpeed(a, b) {
  if (!a || !b) return null;
  const dt = (b.timestamp - a.timestamp) / 1000;
  if (dt <= 0) return null;
  return distanceMeters(a.latitude, a.longitude, b.latitude, b.longitude) / dt;
}

function relativeClock(relativeDeg) {
  const index = Math.floor((relativeDeg + 15) / 30);
  const normalized = ((index % 12) + 12) % 12;
  const hour = normalized === 0 ? 12 : normalized;
  return `${hour}時方向`;
}

function relativeLeftRight(relativeDeg) {
  const value = Math.abs(relativeDeg);
  if (value < 0.5) return "正面 0°";
  return relativeDeg > 0 ? `右 ${value.toFixed(0)}°` : `左 ${value.toFixed(0)}°`;
}

function cardinal(deg) {
  if (!Number.isFinite(deg)) return "--";
  const names = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return names[Math.round(normalize360(deg)/22.5)%16];
}

function xmlEscape(value) {
  return String(value ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;")
    .replaceAll("'","&apos;");
}

function fmt(value, digits=1) {
  return Number.isFinite(value) ? value.toFixed(digits) : "--";
}

function updateUi() {
  $("count").textContent = points.length;
  $("status").textContent = watchId === null ? "停止中" : "記録中";
  $("status").classList.toggle("running", watchId !== null);
  $("start").disabled = watchId !== null;
  $("stop").disabled = watchId === null;

  if (!latest) {
    $("position").textContent = "まだ取得していません";
    return;
  }

  $("position").textContent =
    `緯度 ${latest.latitude.toFixed(7)} / 経度 ${latest.longitude.toFixed(7)} / 高度 ${fmt(latest.altitude,1)} m`;
  $("accuracy").textContent = `精度: ±${fmt(latest.accuracy,1)} m / 時刻: ${new Date(latest.timestamp).toLocaleString("ja-JP")}`;

  const speed = Number.isFinite(latest.speed) ? latest.speed : calculatedSpeed(previousAccepted, latest);
  const course = Number.isFinite(latest.heading) && speed > 0.3
    ? normalize360(latest.heading)
    : calculatedCourse(previousAccepted, latest);

  $("sog").textContent = fmt(speed * MPS_TO_KT, 1);
  $("sogMps").textContent = `${fmt(speed,2)} m/s`;
  $("cog").textContent = fmt(course,0);
  $("cardinal").textContent = cardinal(course);

  if (!waypoint) {
    $("bearing").textContent = "--";
    $("distanceNm").textContent = "--";
    $("distanceM").textContent = "-- m";
    $("relativeClock").textContent = "--";
    $("relativeLR").textContent = "--";
    return;
  }

  const bearing = bearingDegrees(latest.latitude, latest.longitude, waypoint.lat, waypoint.lon);
  const distance = distanceMeters(latest.latitude, latest.longitude, waypoint.lat, waypoint.lon);
  $("bearing").textContent = fmt(bearing,0);
  $("distanceNm").textContent = fmt(distance * M_TO_NM,2);
  $("distanceM").textContent = `${distance < 1000 ? fmt(distance,0)+" m" : fmt(distance/1000,2)+" km"}`;

  if (Number.isFinite(course)) {
    const relative = normalize180(bearing - course);
    $("relativeClock").textContent = relativeClock(relative);
    $("relativeLR").textContent = relativeLeftRight(relative);
  } else {
    $("relativeClock").textContent = "COG待ち";
    $("relativeLR").textContent = "COG待ち";
  }
}

function updateWpUi() {
  if (!waypoint) {
    $("wpInfo").textContent = "未設定";
    $("wpName").value = "";
    $("wpLat").value = "";
    $("wpLon").value = "";
  } else {
    $("wpName").value = waypoint.name || "";
    $("wpLat").value = waypoint.lat;
    $("wpLon").value = waypoint.lon;
    $("wpInfo").textContent =
      `${waypoint.name || "名称なし"} / ${waypoint.lat.toFixed(7)}, ${waypoint.lon.toFixed(7)}`;
  }
  updateUi();
}

function makePoint(position) {
  const c = position.coords;
  return {
    timestamp: position.timestamp || Date.now(),
    latitude: c.latitude,
    longitude: c.longitude,
    accuracy: c.accuracy,
    altitude: c.altitude,
    altitudeAccuracy: c.altitudeAccuracy,
    speed: c.speed,
    heading: c.heading
  };
}

function shouldSave(point) {
  if (!previousAccepted) return true;
  const settings = loadJson(STORAGE_SETTINGS, {interval:1000, minDistance:0});
  const dt = point.timestamp - previousAccepted.timestamp;
  const distance = distanceMeters(
    previousAccepted.latitude, previousAccepted.longitude,
    point.latitude, point.longitude
  );
  return dt >= Number(settings.interval) && distance >= Number(settings.minDistance);
}

function onPosition(position) {
  const point = makePoint(position);
  latest = point;

  if (watchId !== null && shouldSave(point)) {
    points.push(point);
    previousAccepted = point;
    saveJson(STORAGE_POINTS, points);
    log(`保存: ${point.latitude.toFixed(7)}, ${point.longitude.toFixed(7)} / 精度 ${fmt(point.accuracy,1)}m`);
  }
  updateUi();
}

function onGeoError(error) {
  const messages = {
    1:"位置情報の利用が拒否されました",
    2:"位置情報を取得できません",
    3:"位置情報取得がタイムアウトしました"
  };
  log(`GPSエラー: ${messages[error.code] || error.message}`);
  $("status").textContent = "GPSエラー";
}

function startTracking() {
  if (!navigator.geolocation) {
    alert("このブラウザは位置情報に対応していません。");
    return;
  }

  const settings = {
    interval: Number($("interval").value),
    minDistance: Number($("minDistance").value)
  };
  saveJson(STORAGE_SETTINGS, settings);

  if (watchId !== null) return;

  watchId = navigator.geolocation.watchPosition(
    onPosition,
    onGeoError,
    {enableHighAccuracy:true, maximumAge:0, timeout:15000}
  );
  log(`記録開始: 最低間隔 ${settings.interval/1000}秒 / 最低距離 ${settings.minDistance}m`);
  updateUi();
}

function stopTracking() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    log("記録停止");
  }
  watchId = null;
  updateUi();
}

function saveWaypoint() {
  const lat = Number($("wpLat").value);
  const lon = Number($("wpLon").value);
  if (!Number.isFinite(lat) || !Number.isFinite(lon) ||
      lat < -90 || lat > 90 || lon < -180 || lon > 180) {
    alert("正しい緯度・経度を入力してください。");
    return;
  }
  waypoint = {name:$("wpName").value.trim(), lat, lon};
  saveJson(STORAGE_WP, waypoint);
  log(`WP保存: ${waypoint.name || "名称なし"} / ${lat}, ${lon}`);
  updateWpUi();
}

function currentAsWaypoint() {
  if (!latest) {
    alert("現在地がまだ取得できていません。先に記録を開始してください。");
    return;
  }
  waypoint = {
    name:$("wpName").value.trim() || "現在地WP",
    lat:latest.latitude,
    lon:latest.longitude
  };
  saveJson(STORAGE_WP, waypoint);
  log(`現在地をWPに設定: ${waypoint.lat}, ${waypoint.lon}`);
  updateWpUi();
}

function clearWaypoint() {
  if (!confirm("ウェイポイントを削除しますか？")) return;
  waypoint = null;
  localStorage.removeItem(STORAGE_WP);
  log("WP削除");
  updateWpUi();
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function filenameDate() {
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

function exportGpx() {
  if (!points.length) {
    alert("記録データがありません。");
    return;
  }
  const trkpts = points.map(p => {
    const ele = Number.isFinite(p.altitude) ? `    <ele>${p.altitude}</ele>\n` : "";
    const speed = Number.isFinite(p.speed) ? p.speed : "";
    const speedElement = speed !== "" ? `    <speed>${speed}</speed>\n` : "";
    const ext = speed !== "" ? `    <extensions><gpxtpx:TrackPointExtension><gpxtpx:speed>${speed}</gpxtpx:speed></gpxtpx:TrackPointExtension></extensions>\n` : "";
    return `  <trkpt lat="${p.latitude}" lon="${p.longitude}">
${ele}${speedElement}    <time>${new Date(p.timestamp).toISOString()}</time>
${ext}  </trkpt>`;
  }).join("\n");

  const wp = waypoint ? `
  <wpt lat="${waypoint.lat}" lon="${waypoint.lon}">
    <name>${xmlEscape(waypoint.name || "Waypoint")}</name>
  </wpt>` : "";

  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Sailing GPS Logger Web"
 xmlns="http://www.topografix.com/GPX/1/1"
 xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
 xmlns:gpxtpx="http://www.garmin.com/xmlschemas/TrackPointExtension/v1"
 xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">
${wp}
 <trk>
  <name>Sailing Track ${new Date().toISOString()}</name>
  <trkseg>
${trkpts}
  </trkseg>
 </trk>
</gpx>
`;
  downloadBlob(new Blob([gpx], {type:"application/gpx+xml;charset=utf-8"}), `sailing-track-${filenameDate()}.gpx`);
  log(`GPX保存: ${points.length}点`);
}

function csvCell(value) {
  if (value === null || value === undefined) return "";
  const s = String(value);
  return /[",\n]/.test(s) ? `"${s.replaceAll('"','""')}"` : s;
}

function exportCsv() {
  if (!points.length) {
    alert("記録データがありません。");
    return;
  }
  const header = ["timestamp","latitude","longitude","accuracy","altitude","altitudeAccuracy","speed_mps","heading_deg"];
  const rows = points.map(p => [
    new Date(p.timestamp).toISOString(),p.latitude,p.longitude,p.accuracy,
    p.altitude,p.altitudeAccuracy,p.speed,p.heading
  ]);
  const csv = "\uFEFF" + [header,...rows].map(r=>r.map(csvCell).join(",")).join("\n");
  downloadBlob(new Blob([csv], {type:"text/csv;charset=utf-8"}), `sailing-track-${filenameDate()}.csv`);
  log(`CSV保存: ${points.length}点`);
}

function clearData() {
  if (!confirm(`記録済みの ${points.length} 点をすべて削除しますか？`)) return;
  points = [];
  previousAccepted = null;
  localStorage.removeItem(STORAGE_POINTS);
  log("記録データ削除");
  updateUi();
}

$("start").addEventListener("click", startTracking);
$("stop").addEventListener("click", stopTracking);
$("saveWp").addEventListener("click", saveWaypoint);
$("currentWp").addEventListener("click", currentAsWaypoint);
$("clearWp").addEventListener("click", clearWaypoint);
$("exportGpx").addEventListener("click", exportGpx);
$("exportCsv").addEventListener("click", exportCsv);
$("clearData").addEventListener("click", clearData);

const savedSettings = loadJson(STORAGE_SETTINGS, {interval:1000,minDistance:0});
$("interval").value = String(savedSettings.interval ?? 1000);
$("minDistance").value = String(savedSettings.minDistance ?? 0);

updateWpUi();
updateUi();
log(`アプリ起動 / 保存済み ${points.length}点`);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(()=>log("Service Worker登録完了"))
      .catch(e=>log(`Service Worker登録失敗: ${e.message}`));
  });
}
</script>
</body>
</html>
