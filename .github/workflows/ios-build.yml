name: iPhone compile check
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', '.github/workflows/ios-build.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test degree and minute coordinates
        run: swift test --package-path ios
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - run: xcodebuild -project SailingGPS.xcodeproj -scheme SailingGPS -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
      - uses: actions/upload-artifact@v4
        with:
          name: iPhone-simulator-build-not-installable-on-device
          path: ios/build/Build/Products/Debug-iphonesimulator/*.app
      - name: Build unsigned iPhone device target
        run: xcodebuild -project SailingGPS.xcodeproj -scheme SailingGPS -destination 'generic/platform=iOS' -configuration Release -derivedDataPath device-build CODE_SIGNING_ALLOWED=NO build
        working-directory: ios

      - name: Capture Watch navigation and speed previews
        working-directory: ios
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "watchOS" in k for x in v if "Apple Watch" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-watchsimulator/SailingGPSWatch.app
          mkdir -p screenshots
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps.watchkitapp --preview-watch --preview-navigation
          sleep 4
          xcrun simctl io "$DEVICE" screenshot screenshots/Watch-navigation.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps.watchkitapp
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps.watchkitapp --preview-watch --preview-speed
          sleep 4
          xcrun simctl io "$DEVICE" screenshot screenshots/Watch-speed.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps.watchkitapp
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps.watchkitapp --preview-signal-video-b
          sleep 4
          xcrun simctl io "$DEVICE" screenshot screenshots/Watch-signal-video-b.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps.watchkitapp
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps.watchkitapp --preview-watch --preview-speed -watchMagnetic NO
          sleep 2
          xcrun simctl io "$DEVICE" screenshot screenshots/Watch-speed-true.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps.watchkitapp
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps.watchkitapp --preview-watch --preview-speed --preview-low-speed -watchMagnetic YES
          sleep 2
          xcrun simctl io "$DEVICE" screenshot screenshots/Watch-speed-compass.png
          xcrun simctl shutdown "$DEVICE"
      - uses: actions/upload-artifact@v4
        with:
          name: Watch-dashboard-screenshots
          path: ios/screenshots/Watch-*.png
      - name: Capture simulator dashboard screenshots
        continue-on-error: true
        timeout-minutes: 8
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 17:59 --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/SailingGPS.app
          xcrun simctl privacy "$DEVICE" grant location com.goldenfalcons.sailinggps
          xcrun simctl location "$DEVICE" set "35.318,139.467"
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" com.goldenfalcons.sailinggps data)
          mkdir -p "$CONTAINER/Documents"
          printf '%s' '[{"id":"00000000-0000-0000-0000-000000000001","name":"TEST A","latitude":35.317433,"longitude":139.4661,"colorName":"#12ABCD","markSymbol":"marine.lighthouse"},{"id":"00000000-0000-0000-0000-000000000002","name":"TEST B","latitude":35.320,"longitude":139.470}]' > "$CONTAINER/Documents/waypoints.json"
          mkdir -p screenshots
          for SPEED in 1.9 12.3 99.9 100.0; do
            xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps -displayMode 0 --preview-speed-value "$SPEED"
            sleep 2
            xcrun simctl io "$DEVICE" screenshot "screenshots/iPhone-speed-$SPEED.png"
            xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps
          done
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps --preview-focus
          sleep 2
          xcrun simctl io "$DEVICE" screenshot screenshots/iPhone-focus.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps --preview-focus -instrumentMagnetic YES
          sleep 2
          xcrun simctl io "$DEVICE" screenshot screenshots/iPhone-focus-magnetic.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps --preview-settings
          sleep 2
          xcrun simctl io "$DEVICE" screenshot screenshots/iPhone-settings.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps -displayMode 0
          sleep 5
          xcrun simctl io "$DEVICE" screenshot screenshots/iPhone-speed.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps --preview-signal-video-a
          sleep 3
          xcrun simctl io "$DEVICE" screenshot screenshots/iPhone-signal-video-a.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps --preview-signal-video-b
          sleep 3
          xcrun simctl io "$DEVICE" screenshot screenshots/iPhone-signal-video-b.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps -displayMode 1
          # Simulated movement supplies COG so heading-up and course marks can be inspected.
          xcrun simctl location "$DEVICE" start --speed=5 --interval=1 --distance=5 35.318,139.467 35.322,139.471
          sleep 8
          xcrun simctl io "$DEVICE" screenshot screenshots/iPhone-map.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps -displayMode 1 --preview-menu
          sleep 3
          xcrun simctl io "$DEVICE" screenshot screenshots/iPhone-menu.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps --preview-waypoint
          sleep 3
          xcrun simctl io "$DEVICE" screenshot screenshots/iPhone-waypoint-editor.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps -displayMode 1 --target-none
          sleep 3
          xcrun simctl io "$DEVICE" screenshot screenshots/iPhone-target-none.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps -displayMode 1 --preview-map-operations
          sleep 3
          xcrun simctl io "$DEVICE" screenshot screenshots/iPhone-map-operations.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps -displayMode 1 --preview-navigation-options
          sleep 3
          xcrun simctl io "$DEVICE" screenshot screenshots/iPhone-navigation-options.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps -displayMode 1 --preview-library-overlays
          sleep 3
          xcrun simctl io "$DEVICE" screenshot screenshots/iPhone-library-overlays.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps --preview-library
          sleep 3
          xcrun simctl io "$DEVICE" screenshot screenshots/iPhone-map-library.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps || true
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps --preview-circle-editor
          sleep 4
          xcrun simctl io "$DEVICE" screenshot screenshots/iPhone-circle-editor.png
        working-directory: ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-dashboard-screenshots
          path: ios/screenshots/*.png
          if-no-files-found: ignore
