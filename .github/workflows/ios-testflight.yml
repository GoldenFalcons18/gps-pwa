name: iPhone TestFlight upload
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Unique Apple build number (19-9999; increase after each accepted upload)'
        required: true
        default: '19'
permissions:
  contents: read
concurrency:
  group: iphone-testflight
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 35
    environment: testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      BUILD_NUMBER: ${{ inputs.build_number }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify App Store toolchain
        run: |
          set -euo pipefail
          mkdir -p testflight-logs
          xcodebuild -version | tee testflight-logs/toolchain.log
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK_VERSION" | tee -a testflight-logs/toolchain.log
          test "${SDK_VERSION%%.*}" -ge 26
      - name: Validate configuration
        run: |
          python3 - <<'PY'
          import os, re
          names = ['APPLE_TEAM_ID', 'IOS_DISTRIBUTION_P12_BASE64', 'IOS_DISTRIBUTION_P12_PASSWORD', 'IOS_APPSTORE_PROFILE_BASE64', 'APPSTORE_KEY_ID', 'APPSTORE_ISSUER_ID', 'APPSTORE_PRIVATE_KEY_BASE64']
          missing = [n for n in names if not os.environ.get(n)]
          if missing: raise SystemExit('Configure testflight environment secrets: ' + ', '.join(missing))
          value = os.environ['BUILD_NUMBER']
          if not re.fullmatch(r'[1-9][0-9]{0,3}', value) or int(value) <= 18:
              raise SystemExit('Build number must be an integer from 19 through 9999.')
          PY
      - name: Run iPhone logic tests
        run: swift test --package-path ios
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Prepare temporary signing
        run: bash scripts/prepare-testflight-signing.sh
      - name: Archive and export App Store signed app
        run: |
          set -euo pipefail
          mkdir -p testflight-logs
          xcodebuild -project ios/SailingGPS.xcodeproj -scheme SailingGPS -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/SailingGPS.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" SAILING_CODE_SIGN_STYLE=Manual SAILING_CODE_SIGN_IDENTITY="$DISTRIBUTION_IDENTITY" SAILING_PROFILE_UUID="$PROFILE_UUID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" archive 2>&1 | tee testflight-logs/archive.log
          python3 -c 'import os,pathlib,plistlib; p=next((pathlib.Path(os.environ["RUNNER_TEMP"])/"SailingGPS.xcarchive/Products/Applications").glob("*.app/Info.plist")); assert plistlib.loads(p.read_bytes()).get("ITSAppUsesNonExemptEncryption") is False; print("Encryption export declaration verified: false")'
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SailingGPS.xcarchive" -exportPath "$RUNNER_TEMP/testflight-export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" 2>&1 | tee testflight-logs/export.log
      - name: Upload to App Store Connect for TestFlight
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/testflight-export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID" 2>&1 | tee testflight-logs/upload.log
          echo 'Upload sent. Wait for Apple processing, then configure TestFlight testers in App Store Connect.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save build and upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestFlight-build-logs-${{ inputs.build_number }}
          path: testflight-logs/*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/testflight-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/appstore.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          if [ -n "${PROFILE_UUID:-}" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi
          if [ -n "${APPSTORE_KEY_ID:-}" ]; then rm -f "$HOME/private_keys/AuthKey_$APPSTORE_KEY_ID.p8"; fi
