name: Finalize TestFlight build
on:
  pull_request:
    paths:
      - 'scripts/associate-testflight-users-group.rb'
      - '.github/workflows/testflight-finalize.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/associate-testflight-users-group.rb'
  workflow_dispatch:
    inputs:
      build_number:
        description: Existing App Store Connect build number to assign
        required: true
        default: '130'
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Ruby syntax
        run: ruby -c scripts/associate-testflight-users-group.rb
  assign:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    environment: testflight
    env:
      BUILD_NUMBER: ${{ inputs.build_number || '' }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Select existing build number
        run: |
          if [ -z "$BUILD_NUMBER" ]; then
            echo "BUILD_NUMBER=$(tr -d '\r\n' < release/ios-testflight-build-number.txt)" >> "$GITHUB_ENV"
          fi
      - name: Add Japanese notes, assign group, and submit review
        run: ruby scripts/associate-testflight-users-group.rb
