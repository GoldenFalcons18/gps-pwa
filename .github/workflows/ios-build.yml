name: iPhone compile check
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', '.github/workflows/ios-build.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test degree and minute coordinates
        run: swift test --package-path ios
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - run: xcodebuild -project SailingGPS.xcodeproj -scheme SailingGPS -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
      - uses: actions/upload-artifact@v4
        with:
          name: iPhone-simulator-build-not-installable-on-device
          path: ios/build/Build/Products/Debug-iphonesimulator/*.app
      - name: Build unsigned iPhone app for personal signing with AltStore Classic
        run: |
          xcodebuild -project SailingGPS.xcodeproj -scheme SailingGPS -sdk iphoneos -configuration Release -derivedDataPath device-build CODE_SIGNING_ALLOWED=NO build
          mkdir -p package/Payload
          cp -R device-build/Build/Products/Release-iphoneos/SailingGPS.app package/Payload/
          cd package
          zip -qr SailingGPS-unsigned.ipa Payload
        working-directory: ios
      - uses: actions/upload-artifact@v4
        with:
          name: iPhone-unsigned-IPA-requires-AltStore-Classic-signing
          path: ios/package/SailingGPS-unsigned.ipa

      - name: Capture simulator dashboard screenshots
        continue-on-error: true
        timeout-minutes: 8
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 17:59 --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/SailingGPS.app
          mkdir -p screenshots
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps -displayMode 0
          sleep 5
          xcrun simctl io "$DEVICE" screenshot screenshots/iPhone-speed.png
          xcrun simctl terminate "$DEVICE" com.goldenfalcons.sailinggps
          xcrun simctl launch "$DEVICE" com.goldenfalcons.sailinggps -displayMode 1
          sleep 8
          xcrun simctl io "$DEVICE" screenshot screenshots/iPhone-map.png
        working-directory: ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-dashboard-screenshots
          path: ios/screenshots/*.png
          if-no-files-found: ignore
