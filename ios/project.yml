name: SailingGPS
options:
  bundleIdPrefix: com.goldenfalcons
  deploymentTarget:
    iOS: '17.0'
targets:
  SailingGPS:
    type: application
    platform: iOS
    sources: [SailingGPS]
    info:
      path: SailingGPS/Info.plist
      properties:
        CFBundleDisplayName: Sailing GPS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: 航行位置と航跡を表示・記録します。
        NSLocationAlwaysAndWhenInUseUsageDescription: 画面を消した状態でも、開始した航跡記録を続けます。
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldenfalcons.sailinggps
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '1.3.0'
        CURRENT_PROJECT_VERSION: 8
        TARGETED_DEVICE_FAMILY: '1,2'
    scheme: {}
