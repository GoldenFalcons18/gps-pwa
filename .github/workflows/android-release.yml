name: Android signed release
on:
  push:
    paths: ['release/android-signed-build.txt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-signed-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Run unit tests and assemble release
        env:
          KEYSTORE_BASE64: ${{ secrets.SAILING_KEYSTORE_BASE64 }}
          SAILING_KEYSTORE_FILE: ${{ runner.temp }}/sailing-release.jks
          SAILING_KEYSTORE_PASSWORD: ${{ secrets.SAILING_KEYSTORE_PASSWORD }}
          SAILING_KEY_ALIAS: ${{ secrets.SAILING_KEY_ALIAS }}
          SAILING_KEY_PASSWORD: ${{ secrets.SAILING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          trap 'rm -f "$SAILING_KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SAILING_KEYSTORE_FILE"
          gradle -p android :app:testDebugUnitTest :app:assembleRelease --no-daemon
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/SailingGpsLogger.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify dist/SailingGpsLogger.apk
          python3 scripts/release-metadata.py dist/SailingGpsLogger.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch signed APK in Android emulator
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install dist/SailingGpsLogger.apk
            adb shell monkey -p com.goldenfalcons.sailinggps 1
            sleep 5
            adb shell screencap -p /sdcard/release-check.png
            mkdir -p release-check
            adb pull /sdcard/release-check.png release-check/android-1.7.11.png
      - uses: actions/upload-artifact@v4
        with:
          name: Android-1.7.11-release-device-check
          path: release-check/android-1.7.11.png
      - name: Publish signed Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^appVersionName=//p' android/gradle.properties | tr -d '\r')
          gh release create "android-v$VERSION" dist/SailingGpsLogger.apk dist/android-update.json --target "$GITHUB_SHA" --title "Android $VERSION" --notes-file android/RELEASE_NOTES.md
