<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>Sailing GPS Logger - インストール</title>
  <style>
    :root{color-scheme:dark;--bg:#101820;--panel:#1b2732;--text:#f4f7fa;--muted:#b5c1ca;--blue:#36a9ff;--line:#344451}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:680px;margin:0 auto;padding:32px 20px 56px}
    header{text-align:center;padding:18px 0 28px}
    .mark{display:inline-grid;place-items:center;width:72px;height:72px;border-radius:20px;background:#fff;color:#087dcc;font-size:36px;font-weight:800}
    h1{font-size:28px;line-height:1.2;margin:16px 0 8px}
    .lead{margin:0;color:var(--muted)}
    section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0}
    h2{font-size:20px;margin:0 0 6px}
    p{margin:8px 0;color:var(--muted)}
    a.button{display:block;text-align:center;text-decoration:none;background:var(--blue);color:#071522;font-weight:750;padding:13px 18px;border-radius:12px;margin-top:18px}
    a.secondary{background:#283947;color:var(--text)}
    .meta{font-size:14px;min-height:22px}
    footer{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}
    @media(min-width:560px){main{padding-top:52px}section{padding:26px}}
  </style>
</head>
<body>
<main>
  <header>
    <div class="mark" aria-hidden="true">GPS</div>
    <h1>Sailing GPS Logger</h1>
    <p class="lead">ヨット用GPS計器・航跡記録アプリ</p>
  </header>

  <section aria-labelledby="android-title">
    <h2 id="android-title">Android</h2>
    <p>Android端末にAPKをインストールします。更新履歴や旧版からの移行方法もこちらで確認できます。</p>
    <p id="android-meta" class="meta" aria-live="polite">最新のAndroid版を確認しています…</p>
    <a id="android-download" class="button" href="https://github.com/GoldenFalcons18/gps-pwa/releases/latest">Android版を入手</a>
    <a class="button secondary" href="https://github.com/GoldenFalcons18/gps-pwa/releases">更新履歴・移行手順</a>
  </section>

  <section aria-labelledby="ios-title">
    <h2 id="ios-title">iPhone・Apple Watch</h2>
    <p>TestFlightからiPhoneアプリとApple Watchアプリをインストールできます。</p>
    <a class="button" href="https://testflight.apple.com/join/BgNcAsUQ">TestFlightで入手</a>
  </section>

  <footer>このページはネイティブアプリのインストール案内です。</footer>
</main>
<script>
(async function(){
  const meta=document.getElementById("android-meta");
  const button=document.getElementById("android-download");
  try{
    const response=await fetch("https://api.github.com/repos/GoldenFalcons18/gps-pwa/releases?per_page=30",{headers:{Accept:"application/vnd.github+json"}});
    if(!response.ok) throw new Error("release lookup failed");
    const releases=await response.json();
    const release=releases.find(item=>!item.draft&&!item.prerelease&&/^android-v[0-9]/i.test(item.tag_name||""));
    const apk=release&&release.assets&&release.assets.find(asset=>asset.name==="SailingGpsLogger.apk");
    if(apk){
      button.href=apk.browser_download_url;
      meta.textContent=(release.name||release.tag_name)+" · APK "+(apk.size/1024/1024).toFixed(1)+" MB";
    }else{
      meta.textContent="最新APKはリリース一覧から選べます。";
    }
  }catch(_){
    meta.textContent="最新APKの確認ができません。リリース一覧を開いてください。";
  }
})();
</script>
</body>
</html>
