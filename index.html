<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Sailing GPS Logger</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root{
      color-scheme:dark;
      --bg:#000;
      --panel:#050505;
      --line:#8b8b8b;
      --text:#f7f7f7;
      --muted:#b8b8b8;
      --right:#00ff38;
      --left:#ff2020;
      --orange:#ff9d00;
      --blue:#42c8ff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{
      font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;
      font-weight:700;
    }
    main{max-width:1100px;margin:auto;padding:8px 8px 40px}
    button,input,select{font:inherit}
    .instrument{
      border:2px solid var(--line);
      border-radius:14px;
      min-height:360px;
      display:grid;
      grid-template-columns:30% 40% 30%;
      overflow:hidden;
      background:#020202;
    }
    .pane{
      padding:14px;
      min-width:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .left-pane{align-items:flex-start}
    .center-pane{align-items:center;position:relative}
    .right-pane{align-items:center;text-align:center}
    .heading{
      font-size:clamp(24px,4vw,48px);
      color:var(--muted);
      line-height:1.1;
    }
    .distance{
      font-size:clamp(54px,8vw,104px);
      line-height:1;
      letter-spacing:-.055em;
      white-space:nowrap;
      margin-top:14px;
    }
    .distance .unit{font-size:.55em;margin-left:.06em}
    .distance-sub{
      font-size:clamp(20px,2.4vw,34px);
      color:var(--muted);
      margin-top:12px;
    }
    .clock-mode{
      font-size:clamp(28px,3.3vw,46px);
      margin-top:22px;
    }
    .dial{
      width:min(34vw,330px);
      aspect-ratio:1;
      border:4px solid #777;
      border-radius:50%;
      position:relative;
      background:
        radial-gradient(circle at center,transparent 0 58%,#111 58.5% 59.5%,transparent 60%),
        repeating-conic-gradient(from -1deg,#eee 0 1deg,transparent 1deg 9deg);
      box-shadow:0 0 0 3px #242424 inset;
    }
    .dial::after{
      content:"";
      position:absolute;
      inset:17px;
      border-radius:50%;
      background:#020202;
      z-index:0;
    }
    .mark{
      position:absolute;
      z-index:2;
      color:#cfcfcf;
      font-size:clamp(18px,2.3vw,32px);
      font-weight:800;
    }
    .mark.front{top:9%;left:50%;transform:translateX(-50%)}
    .mark.right{right:8%;top:50%;transform:translateY(-50%)}
    .mark.back{bottom:7%;left:50%;transform:translateX(-50%)}
    .mark.left{left:8%;top:50%;transform:translateY(-50%)}
    .arrow-wrap{
      position:absolute;
      inset:0;
      z-index:4;
      transform:rotate(0deg);
      will-change:transform;
      pointer-events:none;
    }
    .arrow{
      position:absolute;
      left:50%;
      top:2%;
      transform:translateX(-50%);
      width:0;
      height:0;
      border-left:28px solid transparent;
      border-right:28px solid transparent;
      border-bottom:62px solid var(--right);
      filter:drop-shadow(0 0 4px rgba(255,255,255,.35));
      transition:border-bottom-color .2s;
    }
    .arrow::after{
      display:none;
    }
    .dial-center{
      position:absolute;
      inset:0;
      z-index:5;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      pointer-events:none;
    }
    .dial-label{
      color:var(--muted);
      font-size:clamp(16px,2vw,27px);
      line-height:1.25;
      margin-top:18px;
    }
    .dial-angle{
      font-size:clamp(58px,8vw,108px);
      line-height:.95;
      margin-top:7px;
      color:var(--right);
      letter-spacing:-.04em;
    }
    .dial-side{
      font-size:clamp(20px,2.4vw,34px);
      margin-top:8px;
    }
    .mode-buttons{
      display:flex;gap:8px;
      margin-top:10px;
      width:100%;
      justify-content:center;
    }
    .mode-buttons button{
      border:1px solid #777;
      border-radius:9px;
      background:#111;
      color:#ddd;
      padding:8px 12px;
      font-size:clamp(15px,1.7vw,22px);
    }
    .mode-buttons button.active{
      background:#eee;color:#000;
    }
    .target-badge{
      color:#eee;
      border:2px solid var(--orange);
      border-radius:10px;
      padding:4px 22px;
      font-size:clamp(30px,4vw,52px);
      line-height:1;
      margin-bottom:18px;
    }
    .wp-name{
      font-size:clamp(28px,4vw,52px);
      line-height:1.13;
      overflow-wrap:anywhere;
    }
    .wp-coords{
      font-size:clamp(22px,3vw,40px);
      line-height:1.25;
      margin-top:12px;
      overflow-wrap:anywhere;
    }
    .metrics{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:10px;
    }
    .metric{
      border:2px solid #666;
      border-radius:14px;
      padding:12px 18px;
      background:#030303;
      text-align:center;
    }
    .metric-label{
      color:var(--muted);
      font-size:clamp(26px,4vw,50px);
      line-height:1;
    }
    .metric-value{
      font-size:clamp(64px,11vw,132px);
      line-height:1;
      letter-spacing:-.04em;
      margin-top:7px;
    }
    .metric-unit{font-size:.42em;margin-left:.05em}
    .statusbar{
      display:flex;
      justify-content:space-between;
      gap:10px;
      border:1px solid #555;
      border-radius:12px;
      padding:10px 14px;
      margin-top:10px;
      font-size:clamp(17px,2vw,25px);
    }
    .status-running{color:var(--right)}
    section{
      border:1px solid #555;
      border-radius:12px;
      padding:14px;
      margin-top:10px;
      background:#050505;
    }
    h2{font-size:clamp(24px,3vw,38px);margin:0 0 12px}
    .formgrid,.buttons{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    input,select,button{
      width:100%;
      border:1px solid #777;
      border-radius:10px;
      background:#101010;
      color:#fff;
      padding:14px;
      font-size:clamp(18px,2.2vw,28px);
    }
    button{cursor:pointer}
    button.primary{background:#056e9d}
    button.danger{background:#6b1616}
    button:disabled{opacity:.45}
    .full{grid-column:1/-1}
    .info{
      margin-top:10px;
      color:#d0d0d0;
      font-size:clamp(17px,2vw,25px);
      line-height:1.5;
      overflow-wrap:anywhere;
    }
    .notice{color:#ffc247}
    pre{
      background:#000;
      border:1px solid #333;
      border-radius:8px;
      padding:10px;
      min-height:110px;
      max-height:240px;
      overflow:auto;
      white-space:pre-wrap;
      color:#b9e5ff;
      font-size:16px;
      font-weight:500;
    }

    .wp-list{
      display:grid;
      gap:8px;
      margin-top:12px;
    }
    .wp-item{
      display:grid;
      grid-template-columns:1fr auto auto;
      gap:8px;
      align-items:center;
      border:1px solid #555;
      border-radius:10px;
      padding:10px;
      background:#090909;
    }
    .wp-item.active{
      border:2px solid var(--orange);
      background:#171000;
    }
    .wp-item-name{
      font-size:clamp(20px,2.4vw,30px);
      overflow-wrap:anywhere;
    }
    .wp-item-coords{
      color:var(--muted);
      font-size:clamp(14px,1.7vw,21px);
      margin-top:4px;
      font-weight:500;
    }
    .wp-item button{
      width:auto;
      min-width:84px;
      padding:10px 12px;
      font-size:clamp(15px,1.7vw,21px);
    }

    @media(max-width:760px){
      main{padding:5px 5px 30px}
      .instrument{
        grid-template-columns:29% 42% 29%;
        min-height:285px;
      }
      .pane{padding:7px}
      .dial{width:min(40vw,290px)}
      .arrow{
        top:1%;
        border-left-width:20px;
        border-right-width:20px;
        border-bottom-width:44px;
      }
      .target-badge{padding:4px 10px}
    }
    @media(max-width:520px){
      .instrument{min-height:235px;border-radius:10px}
      .heading{font-size:18px}
      .distance{font-size:43px;margin-top:8px}
      .distance-sub{font-size:15px;margin-top:7px}
      .clock-mode{font-size:20px;margin-top:12px}
      .dial{width:40vw;border-width:3px}
      .dial::after{inset:11px}
      .mark{font-size:14px}
      .dial-label{font-size:12px;margin-top:9px}
      .dial-angle{font-size:44px}
      .dial-side{font-size:14px;margin-top:4px}
      .mode-buttons{gap:3px;margin-top:4px}
      .mode-buttons button{font-size:10px;padding:5px 4px}
      .target-badge{font-size:21px;margin-bottom:10px}
      .wp-name{font-size:21px}
      .wp-coords{font-size:15px;margin-top:7px}
      .metric{padding:9px 5px}
      .metric-label{font-size:22px}
      .metric-value{font-size:55px}
      .formgrid,.buttons{grid-template-columns:1fr}
      .full{grid-column:auto}
    }
  </style>
</head>
<body>
<main>
  <div class="instrument">
    <div class="pane left-pane">
      <div class="heading">目標まで</div>
      <div class="distance"><span id="distanceNm">--</span><span class="unit">NM</span></div>
      <div id="distanceSub" class="distance-sub">-- m</div>
      <div id="relativeClock" class="clock-mode">--時方向</div>
    </div>

    <div class="pane center-pane">
      <div id="dial" class="dial">
        <span id="markFront" class="mark front">0°</span>
        <span id="markRight" class="mark right">右90°</span>
        <span id="markBack" class="mark back">180°</span>
        <span id="markLeft" class="mark left">左90°</span>
        <div id="arrowWrap" class="arrow-wrap"><div id="arrow" class="arrow"></div></div>
        <div class="dial-center">
          <div id="dialLabel" class="dial-label">目標<br>前方基準</div>
          <div id="dialAngle" class="dial-angle">--</div>
          <div id="dialSide" class="dial-side">--</div>
        </div>
      </div>
      <div class="mode-buttons">
        <button id="relativeMode" class="active">前方0°</button>
        <button id="absoluteMode">絶対方位</button>
      </div>
    </div>

    <div class="pane right-pane">
      <div class="target-badge">目標</div>
      <div id="wpNameDisplay" class="wp-name">未設定</div>
      <div id="wpCoordsDisplay" class="wp-coords">緯度・経度を<br>設定してください</div>
    </div>
  </div>

  <div class="metrics">
    <div class="metric">
      <div class="metric-label">SOG</div>
      <div class="metric-value"><span id="sog">--</span><span class="metric-unit">kt</span></div>
    </div>
    <div class="metric">
      <div class="metric-label">COG / 船首方位</div>
      <div class="metric-value"><span id="cog">--</span><span class="metric-unit">°</span></div>
      <div id="headingSource" class="info" style="margin-top:0;text-align:center">方位ソース：--</div>
    </div>
  </div>

  <div class="statusbar">
    <div>状態：<span id="status">停止中</span></div>
    <div>保存点数：<span id="count">0</span></div>
  </div>

  <section>
    <h2>磁気コンパス</h2>
    <div class="buttons">
      <button id="enableCompass" class="primary full">磁気コンパスを有効化</button>
    </div>
    <div id="compassStatus" class="info">未許可・未取得</div>
    <div class="info notice">0.0 ktでは磁気コンパス、0.1 kt以上ではGPSのCOGを使用します。スマホを船首方向へ真っすぐ向けて固定してください。</div>
  </section>

  <section>
    <h2>ウェイポイント設定</h2>
    <div class="formgrid">
      <input id="wpName" class="full" type="text" placeholder="名称">
      <input id="wpLat" inputmode="decimal" type="number" step="any" placeholder="緯度">
      <input id="wpLon" inputmode="decimal" type="number" step="any" placeholder="経度">
    </div>
    <div class="buttons" style="margin-top:10px">
      <button id="saveWp">新規保存</button>
      <button id="currentWp">現在地を新規保存</button>
      <button id="clearForm" class="full">入力欄をクリア</button>
    </div>
    <div id="wpInfo" class="info">選択中：未設定</div>
    <div id="waypointList" class="wp-list"></div>
  </section>

  <section>
    <h2>GPS記録</h2>
    <div class="formgrid">
      <label class="info">最低保存間隔
        <select id="interval">
          <option value="1000">1秒</option>
          <option value="2000">2秒</option>
          <option value="5000">5秒</option>
          <option value="10000">10秒</option>
        </select>
      </label>
      <label class="info">最低移動距離
        <select id="minDistance">
          <option value="0">指定なし</option>
          <option value="1">1 m</option>
          <option value="3">3 m</option>
          <option value="5">5 m</option>
          <option value="10">10 m</option>
        </select>
      </label>
    </div>
    <div class="buttons" style="margin-top:10px">
      <button id="start" class="primary">記録開始</button>
      <button id="stop" disabled>記録停止</button>
      <button id="exportGpx">GPX保存</button>
      <button id="exportCsv">CSV保存</button>
      <button id="clearData" class="danger full">記録データ削除</button>
    </div>
    <div id="position" class="info">現在地：未取得</div>
    <div id="accuracy" class="info">精度：--</div>
    <div class="info notice">Web版は画面消灯・バックグラウンド移行時にGPS更新が止まる場合があります。</div>
  </section>

  <section>
    <h2>デバッグログ</h2>
    <pre id="log"></pre>
  </section>
</main>

<script>
"use strict";

const STORAGE_POINTS = "sailingGps.points.v1";
const STORAGE_WP = "sailingGps.waypoint.v1";
const STORAGE_WAYPOINTS = "sailingGps.waypoints.v1";
const STORAGE_ACTIVE_WP_ID = "sailingGps.activeWaypointId.v1";
const STORAGE_SETTINGS = "sailingGps.settings.v2";
const STORAGE_DIAL_MODE = "sailingGps.dialMode.v1";
const MPS_TO_KT = 1.9438444924406;
const M_TO_NM = 1 / 1852;
const EARTH_RADIUS_M = 6371000;

let points = loadJson(STORAGE_POINTS, []);
let waypoints = loadJson(STORAGE_WAYPOINTS, []);
let activeWaypointId = localStorage.getItem(STORAGE_ACTIVE_WP_ID);
let legacyWaypoint = loadJson(STORAGE_WP, null);

if (waypoints.length === 0 && legacyWaypoint) {
  const migrated = {
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
    name: legacyWaypoint.name || "Waypoint",
    lat: legacyWaypoint.lat,
    lon: legacyWaypoint.lon
  };
  waypoints = [migrated];
  activeWaypointId = migrated.id;
  saveJson(STORAGE_WAYPOINTS, waypoints);
  localStorage.setItem(STORAGE_ACTIVE_WP_ID, activeWaypointId);
}

let waypoint = waypoints.find(w => w.id === activeWaypointId) || waypoints[0] || null;
if (waypoint && !activeWaypointId) {
  activeWaypointId = waypoint.id;
  localStorage.setItem(STORAGE_ACTIVE_WP_ID, activeWaypointId);
}

let dialMode = localStorage.getItem(STORAGE_DIAL_MODE) || "relative";
let watchId = null;
let latest = null;
let previousAccepted = points.length ? points[points.length - 1] : null;
let lastCourse = null;
let lastSpeed = null;
let magneticHeading = null;
let compassEnabled = false;
let compassEventReceived = false;
const GPS_COURSE_THRESHOLD_KT = 0.05;

let triangleCurrentAngle = 0;
let triangleTargetAngle = 0;
let triangleAnimationStarted = false;
const TRIANGLE_FOLLOW_SPEED = 14;

const $ = id => document.getElementById(id);

function log(message){
  const line=`[${new Date().toLocaleString("ja-JP")}] ${message}`;
  $("log").textContent += line+"\n";
  $("log").scrollTop=$("log").scrollHeight;
  console.log(line);
}
function loadJson(key,fallback){
  try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}
  catch(e){console.error(e);return fallback}
}
function saveJson(key,value){localStorage.setItem(key,JSON.stringify(value))}
function normalize360(deg){const r=deg%360;return r<0?r+360:r}
function normalize180(deg){let r=normalize360(deg);if(r>180)r-=360;return r}
function toRad(v){return v*Math.PI/180}
function toDeg(v){return v*180/Math.PI}
function fmt(value,digits=1){return Number.isFinite(value)?value.toFixed(digits):"--"}

function distanceMeters(lat1,lon1,lat2,lon2){
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const p1=toRad(lat1),p2=toRad(lat2);
  const a=Math.sin(dLat/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dLon/2)**2;
  return 2*EARTH_RADIUS_M*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function bearingDegrees(lat1,lon1,lat2,lon2){
  const p1=toRad(lat1),p2=toRad(lat2),dl=toRad(lon2-lon1);
  const y=Math.sin(dl)*Math.cos(p2);
  const x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return normalize360(toDeg(Math.atan2(y,x)));
}
function calculatedCourse(a,b){
  if(!a||!b)return null;
  if(distanceMeters(a.latitude,a.longitude,b.latitude,b.longitude)<0.8)return null;
  return bearingDegrees(a.latitude,a.longitude,b.latitude,b.longitude);
}
function calculatedSpeed(a,b){
  if(!a||!b)return null;
  const dt=(b.timestamp-a.timestamp)/1000;
  if(dt<=0)return null;
  return distanceMeters(a.latitude,a.longitude,b.latitude,b.longitude)/dt;
}
function relativeClock(relativeDeg){
  const idx=Math.floor((relativeDeg+15)/30);
  const n=((idx%12)+12)%12;
  return `${n===0?12:n}時方向`;
}
function relativeText(relativeDeg){
  const value=Math.abs(relativeDeg);
  if(value<0.5)return "前方 0°";
  return relativeDeg>0?`右 ${value.toFixed(0)}°`:`左 ${value.toFixed(0)}°`;
}
function dms(value,isLat){
  if(!Number.isFinite(value))return "--";
  const abs=Math.abs(value);
  const d=Math.floor(abs);
  const m=(abs-d)*60;
  const dir=isLat?(value>=0?"N":"S"):(value>=0?"E":"W");
  return `${d}°${m.toFixed(3)}′${dir}`;
}

function getScreenAngle(){
  if(screen.orientation && Number.isFinite(screen.orientation.angle)){
    return screen.orientation.angle;
  }
  if(Number.isFinite(window.orientation)){
    return window.orientation;
  }
  return 0;
}

function smoothHeading(previous,next,factor=0.45){
  if(!Number.isFinite(previous))return normalize360(next);
  const delta=normalize180(next-previous);
  return normalize360(previous+delta*factor);
}

function orientationToHeading(event){
  // iPhone Safariは磁北基準の値を直接返す
  if(Number.isFinite(event.webkitCompassHeading)){
    return normalize360(event.webkitCompassHeading);
  }

  // Androidなど。absolute=true または deviceorientationabsolute で利用
  if(Number.isFinite(event.alpha) && (event.absolute===true || event.type==="deviceorientationabsolute")){
    return normalize360(360-event.alpha+getScreenAngle());
  }

  return null;
}

function onOrientation(event){
  const heading=orientationToHeading(event);
  if(!Number.isFinite(heading))return;

  magneticHeading=smoothHeading(magneticHeading,heading);
  compassEventReceived=true;
  $("compassStatus").textContent=`磁気方位：${magneticHeading.toFixed(0)}° / センサー取得中`;
  updateUi();
}

async function enableCompass(){
  try{
    if(typeof DeviceOrientationEvent==="undefined"){
      $("compassStatus").textContent="この端末・ブラウザは方位センサーに対応していません";
      log("磁気コンパス非対応");
      return;
    }

    if(typeof DeviceOrientationEvent.requestPermission==="function"){
      const result=await DeviceOrientationEvent.requestPermission();
      if(result!=="granted"){
        $("compassStatus").textContent="磁気コンパスの使用が許可されませんでした";
        log(`磁気コンパス許可結果: ${result}`);
        return;
      }
    }

    if(!compassEnabled){
      window.addEventListener("deviceorientationabsolute",onOrientation,true);
      window.addEventListener("deviceorientation",onOrientation,true);
      compassEnabled=true;
    }

    $("enableCompass").textContent="磁気コンパス有効";
    $("enableCompass").disabled=true;
    $("compassStatus").textContent="センサー方位を待っています。端末を少し回してください";
    log("磁気コンパスを有効化");
  }catch(error){
    $("compassStatus").textContent=`磁気コンパス開始エラー: ${error.message}`;
    log(`磁気コンパス開始エラー: ${error.message}`);
  }
}


function setTriangleTarget(angle){
  if(!Number.isFinite(angle))return;
  triangleTargetAngle=normalize360(angle);

  if(!triangleAnimationStarted){
    triangleCurrentAngle=triangleTargetAngle;
    triangleAnimationStarted=true;
    $("arrowWrap").style.transform=`rotate(${triangleCurrentAngle}deg)`;
  }
}

function animateTriangle(timestamp){
  if(!animateTriangle.lastTime){
    animateTriangle.lastTime=timestamp;
  }

  const dt=Math.min((timestamp-animateTriangle.lastTime)/1000,0.05);
  animateTriangle.lastTime=timestamp;

  const difference=normalize180(triangleTargetAngle-triangleCurrentAngle);
  const follow=1-Math.exp(-TRIANGLE_FOLLOW_SPEED*dt);

  triangleCurrentAngle=normalize360(
    triangleCurrentAngle+difference*follow
  );

  if(Math.abs(difference)<0.05){
    triangleCurrentAngle=triangleTargetAngle;
  }

  $("arrowWrap").style.transform=`rotate(${triangleCurrentAngle}deg)`;
  requestAnimationFrame(animateTriangle);
}

function setSideColor(relative){
  const color=Math.abs(relative)<0.5?"#f7f7f7":relative>0?"#00ff38":"#ff2020";
  $("dialAngle").style.color=color;
  $("dialSide").style.color=color;
  $("arrow").style.borderBottomColor=color;
  $("arrow").style.color=color;
  return color;
}
function setDialMode(mode){
  dialMode=mode;
  localStorage.setItem(STORAGE_DIAL_MODE,mode);
  $("relativeMode").classList.toggle("active",mode==="relative");
  $("absoluteMode").classList.toggle("active",mode==="absolute");

  if(mode==="relative"){
    $("markFront").textContent="0°";
    $("markRight").textContent="右90°";
    $("markBack").textContent="180°";
    $("markLeft").textContent="左90°";
    $("dialLabel").innerHTML="目標<br>前方基準";
  }else{
    $("markFront").textContent="N";
    $("markRight").textContent="E";
    $("markBack").textContent="S";
    $("markLeft").textContent="W";
    $("dialLabel").innerHTML="目標<br>絶対方位";
  }
  updateUi();
}
function updateUi(){
  $("count").textContent=points.length;
  $("status").textContent=watchId===null?"停止中":"記録中";
  $("status").className=watchId===null?"":"status-running";
  $("start").disabled=watchId!==null;
  $("stop").disabled=watchId===null;

  if(!latest){
    $("position").textContent="現在地：未取得";
    return;
  }

  $("position").textContent=`現在地：${latest.latitude.toFixed(7)}, ${latest.longitude.toFixed(7)} / 高度 ${fmt(latest.altitude,1)} m`;
  $("accuracy").textContent=`精度：±${fmt(latest.accuracy,1)} m / ${new Date(latest.timestamp).toLocaleString("ja-JP")}`;

  const calcSpeed=calculatedSpeed(previousAccepted,latest);
  const speed=Number.isFinite(latest.speed)?latest.speed:calcSpeed;
  if(Number.isFinite(speed))lastSpeed=speed;

  const rawCourse=(Number.isFinite(latest.heading)&&speed>0.3)
    ?normalize360(latest.heading):calculatedCourse(previousAccepted,latest);
  if(Number.isFinite(rawCourse))lastCourse=rawCourse;

  const speedKt=Number.isFinite(lastSpeed)?lastSpeed*MPS_TO_KT:null;
  const gpsMoving=Number.isFinite(speedKt) && speedKt>=GPS_COURSE_THRESHOLD_KT;
  const useGps=gpsMoving && Number.isFinite(lastCourse);
  const useMagnetic=!useGps && Number.isFinite(magneticHeading);
  const navigationHeading=useGps?lastCourse:(useMagnetic?magneticHeading:lastCourse);

  $("sog").textContent=fmt(speedKt,1);
  $("cog").textContent=fmt(navigationHeading,0);

  if(useGps){
    $("headingSource").textContent="方位ソース：GPS対地針路（COG）";
  }else if(useMagnetic){
    $("headingSource").textContent="方位ソース：磁気コンパス（MAG）";
  }else{
    $("headingSource").textContent="方位ソース：未取得";
  }

  if(!waypoint){
    $("distanceNm").textContent="--";
    $("distanceSub").textContent="-- m";
    $("relativeClock").textContent="--時方向";
    $("dialAngle").textContent="--";
    $("dialSide").textContent="WP未設定";
    setTriangleTarget(0);
    setSideColor(0);
    return;
  }

  const bearing=bearingDegrees(latest.latitude,latest.longitude,waypoint.lat,waypoint.lon);
  const distance=distanceMeters(latest.latitude,latest.longitude,waypoint.lat,waypoint.lon);
  $("distanceNm").textContent=fmt(distance*M_TO_NM,2);
  $("distanceSub").textContent=distance<1000?`${fmt(distance,0)} m`:`${fmt(distance/1000,2)} km`;

  if(Number.isFinite(navigationHeading)){
    const relative=normalize180(bearing-navigationHeading);
    $("relativeClock").textContent=relativeClock(relative);
    setSideColor(relative);

    if(dialMode==="relative"){
      $("dialAngle").textContent=Math.abs(relative).toFixed(0)+"°";
      $("dialSide").textContent=relativeText(relative);
      setTriangleTarget(relative);
    }else{
      $("dialAngle").textContent=bearing.toFixed(0)+"°";
      $("dialSide").textContent=relativeText(relative);
      setTriangleTarget(bearing);
    }
  }else{
    $("relativeClock").textContent="方位待ち";
    $("dialAngle").textContent=dialMode==="absolute"?bearing.toFixed(0)+"°":"--";
    $("dialSide").textContent="方位センサー待ち";
    setTriangleTarget(dialMode==="absolute"?bearing:0);
    setSideColor(0);
  }
}
function persistWaypoints(){
  saveJson(STORAGE_WAYPOINTS, waypoints);

  if (waypoint) {
    activeWaypointId = waypoint.id;
    localStorage.setItem(STORAGE_ACTIVE_WP_ID, activeWaypointId);
  } else {
    activeWaypointId = null;
    localStorage.removeItem(STORAGE_ACTIVE_WP_ID);
  }
}

function clearWaypointForm(){
  $("wpName").value="";
  $("wpLat").value="";
  $("wpLon").value="";
}

function selectWaypoint(id){
  const selected=waypoints.find(w=>w.id===id);
  if(!selected)return;

  waypoint=selected;
  activeWaypointId=id;
  localStorage.setItem(STORAGE_ACTIVE_WP_ID,id);

  log(`WP選択: ${selected.name||"名称なし"}`);
  updateWpUi();
}

function deleteWaypoint(id){
  const target=waypoints.find(w=>w.id===id);
  if(!target)return;

  if(!confirm(`ウェイポイント「${target.name||"名称なし"}」を削除しますか？`))return;

  waypoints=waypoints.filter(w=>w.id!==id);

  if(activeWaypointId===id){
    waypoint=waypoints[0]||null;
    activeWaypointId=waypoint?waypoint.id:null;
  }

  persistWaypoints();
  log(`WP削除: ${target.name||"名称なし"}`);
  updateWpUi();
}

function renderWaypointList(){
  const container=$("waypointList");
  container.innerHTML="";

  if(!waypoints.length){
    const empty=document.createElement("div");
    empty.className="info";
    empty.textContent="保存済みウェイポイントはありません。";
    container.appendChild(empty);
    return;
  }

  waypoints.forEach(w=>{
    const item=document.createElement("div");
    item.className="wp-item"+(w.id===activeWaypointId?" active":"");

    const text=document.createElement("div");

    const name=document.createElement("div");
    name.className="wp-item-name";
    name.textContent=w.name||"名称なし";

    const coords=document.createElement("div");
    coords.className="wp-item-coords";
    coords.textContent=`${w.lat.toFixed(7)}, ${w.lon.toFixed(7)}`;

    text.appendChild(name);
    text.appendChild(coords);

    const selectButton=document.createElement("button");
    selectButton.textContent=w.id===activeWaypointId?"選択中":"選択";
    selectButton.disabled=w.id===activeWaypointId;
    selectButton.addEventListener("click",()=>selectWaypoint(w.id));

    const deleteButton=document.createElement("button");
    deleteButton.textContent="削除";
    deleteButton.className="danger";
    deleteButton.addEventListener("click",()=>deleteWaypoint(w.id));

    item.appendChild(text);
    item.appendChild(selectButton);
    item.appendChild(deleteButton);
    container.appendChild(item);
  });
}

function updateWpUi(){
  if(!waypoint){
    $("wpInfo").textContent="選択中：未設定";
    $("wpNameDisplay").textContent="未設定";
    $("wpCoordsDisplay").innerHTML="緯度・経度を<br>設定してください";
  }else{
    $("wpInfo").textContent=`選択中：${waypoint.name||"名称なし"} / ${waypoint.lat.toFixed(7)}, ${waypoint.lon.toFixed(7)}`;
    $("wpNameDisplay").textContent=waypoint.name||"名称なし";
    $("wpCoordsDisplay").innerHTML=`${dms(waypoint.lat,true)}<br>${dms(waypoint.lon,false)}`;
  }

  renderWaypointList();
  updateUi();
}

function makePoint(position){
  const c=position.coords;
  return{
    timestamp:position.timestamp||Date.now(),
    latitude:c.latitude,longitude:c.longitude,accuracy:c.accuracy,
    altitude:c.altitude,altitudeAccuracy:c.altitudeAccuracy,
    speed:c.speed,heading:c.heading
  };
}
function shouldSave(point){
  if(!previousAccepted)return true;
  const settings=loadJson(STORAGE_SETTINGS,{interval:1000,minDistance:0});
  const dt=point.timestamp-previousAccepted.timestamp;
  const distance=distanceMeters(previousAccepted.latitude,previousAccepted.longitude,point.latitude,point.longitude);
  return dt>=Number(settings.interval)&&distance>=Number(settings.minDistance);
}
function onPosition(position){
  const point=makePoint(position);
  latest=point;
  if(watchId!==null&&shouldSave(point)){
    points.push(point);
    previousAccepted=point;
    saveJson(STORAGE_POINTS,points);
    log(`保存: ${point.latitude.toFixed(7)}, ${point.longitude.toFixed(7)} / 精度 ${fmt(point.accuracy,1)}m`);
  }
  updateUi();
}
function onGeoError(error){
  const messages={1:"位置情報の利用が拒否されました",2:"位置情報を取得できません",3:"位置情報取得がタイムアウトしました"};
  log(`GPSエラー: ${messages[error.code]||error.message}`);
  $("status").textContent="GPSエラー";
}
function startTracking(){
  if(!navigator.geolocation){alert("このブラウザは位置情報に対応していません。");return}
  const settings={interval:Number($("interval").value),minDistance:Number($("minDistance").value)};
  saveJson(STORAGE_SETTINGS,settings);
  if(watchId!==null)return;
  watchId=navigator.geolocation.watchPosition(onPosition,onGeoError,{enableHighAccuracy:true,maximumAge:0,timeout:15000});
  log(`記録開始: ${settings.interval/1000}秒 / ${settings.minDistance}m`);
  updateUi();
}
function stopTracking(){
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);log("記録停止")}
  watchId=null;updateUi();
}
function createWaypoint(name,lat,lon){
  return {
    id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
    name: name || `Waypoint ${waypoints.length+1}`,
    lat,
    lon
  };
}

function saveWaypoint(){
  const lat=Number($("wpLat").value),lon=Number($("wpLon").value);
  if(!Number.isFinite(lat)||!Number.isFinite(lon)||lat<-90||lat>90||lon<-180||lon>180){
    alert("正しい緯度・経度を入力してください。");
    return;
  }

  const newWaypoint=createWaypoint($("wpName").value.trim(),lat,lon);
  waypoints.push(newWaypoint);
  waypoint=newWaypoint;
  activeWaypointId=newWaypoint.id;

  persistWaypoints();
  clearWaypointForm();

  log(`WP新規保存: ${newWaypoint.name} / ${lat}, ${lon}`);
  updateWpUi();
}

function currentAsWaypoint(){
  if(!latest){
    alert("現在地がまだ取得できていません。先に記録を開始してください。");
    return;
  }

  const newWaypoint=createWaypoint(
    $("wpName").value.trim(),
    latest.latitude,
    latest.longitude
  );

  waypoints.push(newWaypoint);
  waypoint=newWaypoint;
  activeWaypointId=newWaypoint.id;

  persistWaypoints();
  clearWaypointForm();

  log(`現在地をWP新規保存: ${newWaypoint.name}`);
  updateWpUi();
}

function xmlEscape(value){
  return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&apos;");
}
function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function filenameDate(){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function exportGpx(){
  if(!points.length){alert("記録データがありません。");return}
  const trkpts=points.map(p=>{
    const ele=Number.isFinite(p.altitude)?`    <ele>${p.altitude}</ele>\n`:"";
    const speed=Number.isFinite(p.speed)?p.speed:"";
    const speedElement=speed!==""?`    <speed>${speed}</speed>\n`:"";
    const ext=speed!==""?`    <extensions><gpxtpx:TrackPointExtension><gpxtpx:speed>${speed}</gpxtpx:speed></gpxtpx:TrackPointExtension></extensions>\n`:"";
    return `  <trkpt lat="${p.latitude}" lon="${p.longitude}">\n${ele}${speedElement}    <time>${new Date(p.timestamp).toISOString()}</time>\n${ext}  </trkpt>`;
  }).join("\n");
  const wp=waypoints.map(w=>
    `\n  <wpt lat="${w.lat}" lon="${w.lon}"><name>${xmlEscape(w.name||"Waypoint")}</name></wpt>`
  ).join("");
  const gpx=`<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Sailing GPS Logger Web V4"
 xmlns="http://www.topografix.com/GPX/1/1"
 xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
 xmlns:gpxtpx="http://www.garmin.com/xmlschemas/TrackPointExtension/v1">${wp}
 <trk><name>Sailing Track ${new Date().toISOString()}</name><trkseg>
${trkpts}
 </trkseg></trk>
</gpx>`;
  downloadBlob(new Blob([gpx],{type:"application/gpx+xml;charset=utf-8"}),`sailing-track-${filenameDate()}.gpx`);
  log(`GPX保存: ${points.length}点`);
}
function csvCell(value){
  if(value===null||value===undefined)return"";
  const s=String(value);return/[",\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s;
}
function exportCsv(){
  if(!points.length){alert("記録データがありません。");return}
  const header=["timestamp","latitude","longitude","accuracy","altitude","altitudeAccuracy","speed_mps","heading_deg"];
  const rows=points.map(p=>[new Date(p.timestamp).toISOString(),p.latitude,p.longitude,p.accuracy,p.altitude,p.altitudeAccuracy,p.speed,p.heading]);
  const csv="\uFEFF"+[header,...rows].map(r=>r.map(csvCell).join(",")).join("\n");
  downloadBlob(new Blob([csv],{type:"text/csv;charset=utf-8"}),`sailing-track-${filenameDate()}.csv`);
  log(`CSV保存: ${points.length}点`);
}
function clearData(){
  if(!confirm(`記録済みの ${points.length} 点をすべて削除しますか？`))return;
  points=[];previousAccepted=null;localStorage.removeItem(STORAGE_POINTS);log("記録データ削除");updateUi();
}

$("enableCompass").addEventListener("click",enableCompass);
$("relativeMode").addEventListener("click",()=>setDialMode("relative"));
$("absoluteMode").addEventListener("click",()=>setDialMode("absolute"));
$("start").addEventListener("click",startTracking);
$("stop").addEventListener("click",stopTracking);
$("saveWp").addEventListener("click",saveWaypoint);
$("currentWp").addEventListener("click",currentAsWaypoint);
$("clearForm").addEventListener("click",clearWaypointForm);
$("exportGpx").addEventListener("click",exportGpx);
$("exportCsv").addEventListener("click",exportCsv);
$("clearData").addEventListener("click",clearData);

const savedSettings=loadJson(STORAGE_SETTINGS,{interval:1000,minDistance:0});
$("interval").value=String(savedSettings.interval??1000);
$("minDistance").value=String(savedSettings.minDistance??0);

setDialMode(dialMode);
updateWpUi();
updateUi();
requestAnimationFrame(animateTriangle);
log(`アプリ起動 / 保存済み ${points.length}点`);
log("磁気コンパスはボタン操作後に有効になります");

if("serviceWorker"in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./service-worker.js")
      .then(()=>log("Service Worker登録完了"))
      .catch(e=>log(`Service Worker登録失敗: ${e.message}`));
  });
}
</script>
</body>
